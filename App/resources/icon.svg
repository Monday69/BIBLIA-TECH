<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fond blanc carré pour icône Android -->
  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- Logo BIBLIA-TECH centré (1024×512 dans 1024×1024) -->
  <svg viewBox="0 0 680 340" x="0" y="256" width="1024" height="512">
    <g transform="translate(190, 60)">
      <!-- Livre 1 : jaune -->
      <rect x="0" y="0" width="56" height="160" rx="3" fill="#c9a84c"/>
      <rect x="0" y="0" width="9" height="160" rx="2" fill="#a8862e"/>
      <rect x="14" y="28" width="34" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <rect x="14" y="46" width="26" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <rect x="14" y="64" width="30" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <!-- Livre 2 : bleu -->
      <rect x="62" y="0" width="46" height="160" rx="3" fill="#1a3a5c"/>
      <rect x="62" y="0" width="8" height="160" rx="2" fill="#122840"/>
      <rect x="76" y="28" width="26" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <rect x="76" y="46" width="18" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <rect x="76" y="64" width="22" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <!-- Livre 3 : rouge -->
      <rect x="114" y="0" width="64" height="160" rx="3" fill="#8b3a3a"/>
      <rect x="114" y="0" width="9" height="160" rx="2" fill="#6b2a2a"/>
      <rect x="130" y="28" width="40" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <rect x="130" y="46" width="30" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <rect x="130" y="64" width="36" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <!-- Livre 4 : vert -->
      <rect x="184" y="0" width="52" height="160" rx="3" fill="#1a6b4a"/>
      <rect x="184" y="0" width="8" height="160" rx="2" fill="#145c3e"/>
      <rect x="198" y="28" width="30" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <rect x="198" y="46" width="22" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <rect x="198" y="64" width="26" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
      <!-- Cadre pointillé doré -->
      <rect x="-8" y="-8" width="252" height="176" rx="6" fill="none" stroke="#c9a84c" stroke-width="2.5" stroke-dasharray="6 3"/>
      <!-- Cercles de vérification -->
      <circle cx="28"  cy="80" r="18" fill="rgba(74,222,128,0.15)"/>
      <circle cx="85"  cy="80" r="18" fill="rgba(74,222,128,0.15)"/>
      <circle cx="146" cy="80" r="18" fill="rgba(74,222,128,0.15)"/>
      <circle cx="210" cy="80" r="18" fill="rgba(74,222,128,0.15)"/>
      <!-- Coches vertes -->
      <path d="M20 80 L26 87 L36 72"   fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M77 80 L83 87 L93 72"   fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M138 80 L144 87 L154 72" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M202 80 L208 87 L218 72" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Loupe dorée -->
      <circle cx="272" cy="72" r="36" fill="rgba(201,168,76,0.1)" stroke="#c9a84c" stroke-width="3.5"/>
      <line x1="298" y1="98" x2="318" y2="118" stroke="#c9a84c" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="340" y="268" font-family="Georgia, serif" font-size="38" font-weight="700"
      fill="#3a5c48" text-anchor="middle" letter-spacing="3">BIBLIA-TECH</text>
    <text x="340" y="292" font-family="Georgia, serif" font-size="12"
      fill="#888" text-anchor="middle" letter-spacing="5">LIBRARY SCANNER</text>
  </svg>
</svg>
